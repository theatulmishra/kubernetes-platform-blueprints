apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-resource-limits
  labels:
    platform.blueprint/component: rbac
spec:
  hard:
    pods: "10"
    services: "5"
    services.loadbalancers: "2"
    configmaps: "15"
    secrets: "15"
    persistentvolumeclaims: "5"
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: namespace-container-limits
  labels:
    platform.blueprint/component: rbac
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "1Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
