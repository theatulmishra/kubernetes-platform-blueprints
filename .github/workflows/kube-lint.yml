name: Kubernetes Lint and Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-scan:
    name: Validate and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Compile Kustomize overlays for validation
      - name: Build Kustomize Overlays
        run: |
          mkdir -p build/
          kubectl kustomize overlays/dev > build/dev-rendered.yaml
          kubectl kustomize overlays/prod > build/prod-rendered.yaml

      # Validate fully-rendered Kubernetes schemas using Kubeconform
      - name: Run Kubeconform Linter
        run: |
          docker run --rm -v ${{ github.workspace }}:/manifests ghcr.io/yannh/kubeconform:latest-alpine \
            -summary -strict -ignore-missing-schemas \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -verbose \
            /manifests/build/dev-rendered.yaml /manifests/build/prod-rendered.yaml

      # Scan configuration files for security vulnerabilities
      - name: Run Trivy Config Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'config'
          format: 'table'
          exit-code: '1' # Break the build if severity is critical/high. Change to 0 to just report.
          severity: 'HIGH,CRITICAL'
